# Každý den (přes noc a ráno, viz časy níže) spustí hlidac.js, uloží stav zpět do repozitáře
# a zveřejní přehled (index.html) přes GitHub Pages.
# Ruční spuštění na zkoušku: záložka Actions -> Hlídač nabídek -> Run workflow.
name: Hlídač nabídek

on:
  schedule:
    # Čas je pražský (timezone), takže se letní/zimní čas řeší sám. Spouští se víckrát za sebou na „divné“ minuty.
    # GitHub plánované běhy tohoto repozitáře posouvá o mnoho hodin (11.–13. 11. 2026 přišly až odpoledne), proto
    # jsou termíny i přes noc: i se zpožděním by měl být běh hotový ráno. První spuštění, které proběhne, udělá práci;
    # další se samy přeskočí (viz první krok). Zda noční termíny pomáhají, se teprve ověřuje.
    - cron: "17 22 * * *"
      timezone: "Europe/Prague"
    - cron: "17 0 * * *"
      timezone: "Europe/Prague"
    - cron: "17 2 * * *"
      timezone: "Europe/Prague"
    - cron: "17 4 * * *"
      timezone: "Europe/Prague"
    - cron: "17 6 * * *"
      timezone: "Europe/Prague"
    - cron: "17 7 * * *"
      timezone: "Europe/Prague"
    - cron: "17 8 * * *"
      timezone: "Europe/Prague"
    - cron: "17 9 * * *"
      timezone: "Europe/Prague"
  workflow_dispatch: # ruční spuštění tlačítkem „Run workflow“ (hodinu nekontroluje)

# Nikdy nesmí běžet dva běhy najednou (např. plán + ruční spuštění).
concurrency:
  group: hlidac-nabidek
  cancel-in-progress: false

jobs:
  hlidac:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # commit stavových souborů zpět do repozitáře
    outputs:
      spustit: ${{ steps.cas.outputs.spustit }}
    steps:
      - uses: actions/checkout@v4

      # U plánovaného spuštění: pokud v posledních 16 hodinách proběhl úspěšný běh (last-run.json), skončíme.
      # Ruční spuštění se spustí vždy.
      - name: Proběhl v posledních 16 hodinách úspěšný běh? (jen u plánovaného spuštění)
        id: cas
        run: |
          stari_hodin=$(node -e 'const r=JSON.parse(require("fs").readFileSync("last-run.json","utf8")); console.log(r.uspech===true && r.zacatek ? ((Date.now()-Date.parse(r.zacatek))/3600000).toFixed(1) : "")' 2>/dev/null || true)
          if [ "${{ github.event_name }}" = "schedule" ] && [ -n "$stari_hodin" ] && awk "BEGIN{exit !($stari_hodin < 16)}"; then
            echo "Poslední úspěšný běh byl před $stari_hodin h – tento běh přeskakuji."
            echo "spustit=ne" >> "$GITHUB_OUTPUT"
          else
            echo "spustit=ano" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.cas.outputs.spustit == 'ano'
        with:
          node-version: 24
          cache: npm

      - name: Nainstalovat balíčky
        if: steps.cas.outputs.spustit == 'ano'
        run: npm ci

      - name: Spustit hlídač
        id: beh
        if: steps.cas.outputs.spustit == 'ano'
        env:
          # Klíče se berou ze Secrets (Settings → Secrets and variables → Actions). V logu se nezobrazí.
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }} # název kanálu pro upozornění (když chybí, upozornění se neposílají)
        run: node hlidac.js

      # Stav (co už hlídač viděl a výsledky) se uloží i po chybném běhu, ať se nic neztratí.
      - name: Uložit stav zpět do repozitáře
        if: always() && steps.cas.outputs.spustit == 'ano'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen.json results.json last-run.json
          if git diff --cached --quiet; then
            echo "Žádné změny ve stavu."
          else
            git commit -m "Data: běh $(date -u +%F)"
            git pull --rebase
            git push
          fi

      # Na web se nahraje JEN index.html, manifest.webmanifest a obrázky ikony (nic jiného z repozitáře).
      - name: Připravit stránku pro GitHub Pages
        if: steps.cas.outputs.spustit == 'ano'
        run: |
          mkdir -p _site/ikony
          cp index.html manifest.webmanifest _site/
          cp ikony/*.svg ikony/*.png _site/ikony/ # jen obrázky ikony, ne skript vytvor-ikony.js

      - uses: actions/upload-pages-artifact@v3
        if: steps.cas.outputs.spustit == 'ano'
        with:
          path: _site

  zverejnit:
    needs: hlidac
    if: needs.hlidac.outputs.spustit == 'ano'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
